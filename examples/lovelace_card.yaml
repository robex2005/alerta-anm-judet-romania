type: conditional
conditions:
- condition: state
  entity: sensor.mesaj_meteo_mures
  state: alerta
card:
  type: custom:expander-card
  title: AVERTIZARE METEO
  icon: mdi:alert
  expanded: true
  animation: true
  cards:
  - type: entities
    card_mod:
      style: |
        ha-card {
          background: transparent !important;

          border: none !important;
          margin: -6px !important;
        }
        #states {
          padding: 7px !important;
        }

        :host {  }
    entities:
    - type: custom:button-card
      entity: sensor.mesaj_meteo_mures
      show_name: false
      show_label: true
      show_state: false
      show_icon: false
      label: |-
        [[[
          const mesajEntity = states['sensor.mesaj_meteo_mures'];
          const text_complet = (mesajEntity && mesajEntity.attributes)
            ? (mesajEntity.attributes.mesaj_complet || mesajEntity.state || '')
            : '';

          const sensor_ids = states['sensor.anm_avertizare_id'];
          let lista_ids = [];
          if (sensor_ids && sensor_ids.state &&
              !['0', 'unavailable', 'unknown', 'none', ''].includes(sensor_ids.state.trim())) {
            lista_ids = sensor_ids.state.split(',').map(s => s.trim()).filter(s => s !== '').reverse();
          }

          const colorSensors = Object.keys(states).filter(key => key.startsWith('sensor.culoare_harta_'));
          const sensor_colors = colorSensors.length > 0 ? states[colorSensors[0]] : null;
          const map_colors = (sensor_colors && sensor_colors.attributes && sensor_colors.attributes.date_harti)
            ? sensor_colors.attributes.date_harti : {};

          let numeJudet = 'Mureș';

          if (!text_complet || ['fara avertizari', 'unknown', 'unavailable'].includes(text_complet.toLowerCase().trim())) {
            return 'Nu sunt avertizări active.';
          }

          const text_lower = text_complet.toLowerCase();
          let colorKey = '';
          let highlightColor = '#f1c40f';
          if (text_lower.includes('rosu') || text_lower.includes('roșu')) {
            highlightColor = '#e74c3c'; colorKey = 'rosu';
          } else if (text_lower.includes('portocaliu')) {
            highlightColor = '#e67e22'; colorKey = 'portocaliu';
          } else if (text_lower.includes('galben')) {
            highlightColor = '#f1c40f'; colorKey = 'galben';
          }

          function emojiFenomen(s) {
            const x = s.toLowerCase();
            if (x.includes('grindin')) return '🌨️';
            if (x.includes('descărcări') || x.includes('descarcari') || x.includes('oraj') || x.includes('furtun')) return '⛈️';
            if (x.includes('canicul') || x.includes('călduroas') || x.includes('calduroas') || x.includes('temperaturi deosebit de ridicate') || x.includes('disconfort termic')) return '🥵';
            if (x.includes('ger') || x.includes('temperaturi scăzute') || x.includes('temperaturi scazute') || x.includes('frig')) return '🥶';
            if (x.includes('viscol')) return '🌬️';
            if (x.includes('ninsor') || x.includes('zăpad') || x.includes('zapad')) return '❄️';
            if (x.includes('inundați') || x.includes('inundati') || x.includes('viitur')) return '🌊';
            if (x.includes('averse') || x.includes('instabilitate') || x.includes('ploa') || x.includes('precipitați') || x.includes('precipitati')) return '🌧️';
            if (x.includes('vânt') || x.includes('vant') || x.includes('rafal') || x.includes('vijelii')) return '💨';
            if (x.includes('ceață') || x.includes('ceata')) return '🌫️';
            return '⚠️';
          }

          let perechi = [];
          const reBloc = /Interval[^:]*:\s*([^]*?)\s*Fenomene[^:]*:\s*([^]*?)(?=\s*Zone|\s*Interval|\s*Not[ăa]|\s*COD |\s*ATEN[ȚT]IONARE|\s*AVERTIZARE|\s*INFORMARE|$)/gi;
          let mBloc;
          while ((mBloc = reBloc.exec(text_complet)) !== null) {
            let interval = mBloc[1].trim().replace(/\s+/g, ' ').replace(/[•·\-–]\s*$/, '').trim();
            let fen = mBloc[2].trim().replace(/\s+/g, ' ').replace(/[•·\-–]\s*$/, '').trim();
            if (fen && fen.length > 2) perechi.push({ interval: interval, fen: fen });
          }
          const seen = new Set();
          perechi = perechi.filter(p => {
            const k = p.interval + '|' + p.fen;
            if (seen.has(k)) return false;
            seen.add(k);
            return true;
          });

          let rezumat = '';
          if (perechi.length > 0) {
            rezumat = `<div style="margin-bottom:10px;">
                         <div style="font-size:12px;font-weight:bold;text-transform:uppercase;letter-spacing:0.5px;color:${highlightColor};margin-bottom:8px;">📋 Rezumat — fenomene vizate</div>`;
            perechi.forEach(p => {
              rezumat += `<div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:9px;line-height:1.4;">
                            <span style="font-size:18px;flex-shrink:0;line-height:1.3;">${emojiFenomen(p.fen)}</span>
                            <span>`;
              if (p.interval && p.interval.length > 2) {
                rezumat += `<span style="font-size:11px;color:${highlightColor};font-weight:bold;display:block;">🕒 ${p.interval}</span>`;
              }
              rezumat += `<span style="font-size:13px;">${p.fen}</span>
                            </span>
                          </div>`;
            });
            rezumat += `</div>
                        <div style="border-bottom:2px solid ${highlightColor};opacity:0.4;margin:12px 0 14px;"></div>`;
          }

          let msg_fmt = text_complet
            .replace(/Interval de valabilitate:?/gi, `<br>• <b style="color:${highlightColor}">Interval:</b>`)
            .replace(/Fenomene(?: și zone)? vizate:?/gi, `<br>• <b style="color:${highlightColor}">Fenomene:</b>`)
            .replace(/Zone afectate:?/gi, `<br>• <b style="color:${highlightColor}">Zone:</b>`)
            .replace(/Notă:?/gi, `<br>• <b style="color:${highlightColor}">Notă:</b>`)
            .replace(/COD GALBEN/gi, `<span style="background:#f1c40f;color:black;padding:1px 5px;border-radius:3px;font-weight:bold;">COD GALBEN</span>`)
            .replace(/COD PORTOCALIU/gi, `<span style="background:#e67e22;color:black;padding:1px 5px;border-radius:3px;font-weight:bold;">COD PORTOCALIU</span>`)
            .replace(/COD RO[ȘS]U/gi, `<span style="background:#e74c3c;color:white;padding:1px 5px;border-radius:3px;font-weight:bold;">COD ROSU</span>`)
            .replace(/ATENȚIONARE METEOROLOGICĂ/gi, `<b style="color:${highlightColor};font-size:13px;">ATENȚIONARE METEOROLOGICĂ</b>`)
            .replace(/AVERTIZARE METEOROLOGICĂ/gi, `<b style="color:${highlightColor};font-size:13px;">AVERTIZARE METEOROLOGICĂ</b>`)
            .replace(/INFORMARE METEOROLOGICĂ/gi, `<b style="color:${highlightColor};font-size:13px;">INFORMARE METEOROLOGICĂ</b>`);

          const regexJudet = new RegExp('(Mureș|Mures|mureș|mures)', 'gi');
          msg_fmt = msg_fmt.replace(regexJudet, `<b style="text-decoration:underline;color:${highlightColor};">$&</b>`);

          let id_gasit = null;
          if (colorKey !== '') {
            id_gasit = lista_ids.find(id => map_colors[id] === colorKey);
          }
          if (!id_gasit && lista_ids.length > 0) {
            id_gasit = lista_ids[0];
          }

          let harta_html = '';
          if (id_gasit) {
            const url_img = `https://images.weserv.nl/?url=${encodeURIComponent('https://www.meteoromania.ro/wp-content/plugins/meteo/harti/harta.svg.php?id_avertizare=' + id_gasit)}&v=${new Date().getTime()}`;
            harta_html = `<div style="margin:15px 0;text-align:center;">
                             <div style="font-size:11px;font-weight:bold;color:${highlightColor};margin-bottom:5px;text-transform:uppercase;">Hartă ${numeJudet}</div>
                             <img src="${url_img}" style="width:90%;display:block;margin:0 auto;border-radius:8px;border:1.5px solid ${highlightColor};box-shadow:0 2px 8px rgba(0,0,0,0.15);">
                           </div>`;
          }

          const html_final = `<div style="border-left:4px solid ${highlightColor};padding-left:10px;line-height:1.6;">
                          ${msg_fmt}
                        </div>`;

          return rezumat + harta_html + html_final;
        ]]]
      styles:
        card:
        - padding: 16px
        - border-radius: 12px
        label:
        - text-align: left
        - font-size: 13px
        - white-space: normal
        - overflow: visible
        - display: block
        - width: 100%
      tap_action:
        action: url
        url_path: https://www.meteoromania.ro/avertizari/
  card_mod:
    style: |
      {% set colors = state_attr('sensor.culoare_harta_mures', 'date_harti') %} {% set ids = states('sensor.anm_avertizare_id') %} {% set mesaj = states('sensor.mesaj_meteo_mures') %}
      {% set lista_ids = ids.split(',') if ids not in ['0', 'unavailable', 'unknown', 'none', ''] else [] %}
      {% set prioritate = {'rosu': 3, 'portocaliu': 2, 'galben': 1} %} {% set culoare = namespace(val='var(--primary-text-color)', prio=0) %}
      {% if mesaj not in ['fara avertizari', 'unknown', 'unavailable'] and lista_ids | length > 0 %}
        {% for id in lista_ids %}
          {% set id_trim = id.strip() %}
          {% if colors and id_trim in colors %}
            {% set c = colors[id_trim] %}
            {% if prioritate.get(c, 0) > culoare.prio %}
              {% set culoare.prio = prioritate.get(c, 0) %}
              {% if c == 'rosu' %}{% set culoare.val = '#e74c3c' %}
              {% elif c == 'portocaliu' %}{% set culoare.val = '#e67e22' %}
              {% elif c == 'galben' %}{% set culoare.val = '#f1c40f' %}
              {% endif %}
            {% endif %}
          {% endif %}
        {% endfor %}
      {% endif %}
      .title {
        font-weight: 900 !important;
        font-size: 16px !important;
        text-transform: uppercase !important;
        color: {{ culoare.val }} !important;
      } ha-icon {
        color: {{ culoare.val }} !important;
        --mdc-icon-color: {{ culoare.val }} !important;
      }
